n%3D%22round%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M73%2052%20Q75%2036%2067%2031%20L64%2043%20Q69%2045%2070%2052%20Z%22%20fill%3D%22%232B2A33%22%20stroke%3D%22%2323264A%22%20stroke-width%3D%222.5%22%20stroke-linejoin%3D%22round%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M42%2029%20Q49%2020%2060%2024%20L58%2029.5%20Q51%2027%2045%2032%20Z%22%20fill%3D%22%232B2A33%22%20stroke%3D%22%2323264A%22%20stroke-width%3D%222.5%22%20stroke-linejoin%3D%22round%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fg%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2247%22%20fill%3D%22none%22%20stroke%3D%22%2323264A%22%20stroke-width%3D%225%22%2F%3E%3C%2Fsvg%3E">

<title>コテンラジオ非公式索引</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root{
  --bg:#FFF6DC; --dot:#F2E1AE; --surface:#FFFFFF; --surface-2:#FFF0C4; --ink:#23264A; --ink-2:#474B72; --muted:#75779A;
  --edge:#23264A; --hair:#EEDFB6; --link:#2F5FD0; --on-pop:#23264A;
  --coral:#FF6A5C; --mint:#5ED3A5; --sun:#FFC53D; --sky:#8CC2FF; --lilac:#CDB9FF; --mark:#FFE17A; --danger:#D6322A;
  --f-pop:"Mochiy Pop One","Hiragino Maru Gothic ProN","Arial Rounded MT Bold","Zen Maru Gothic",sans-serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  --sh:3px 3px 0 var(--edge);
  --maxw:1120px; --gut:clamp(16px,4vw,32px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1D2042; --dot:#282C56; --surface:#292D57; --surface-2:#353A6A; --ink:#FFF6DC; --ink-2:#DCD9F0; --muted:#A9ABCD;
    --edge:#0A0B1D; --hair:#3B4076; --link:#A4C8FF; --mark:#846C1F; --danger:#FF8A80;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1D2042; --dot:#282C56; --surface:#292D57; --surface-2:#353A6A; --ink:#FFF6DC; --ink-2:#DCD9F0; --muted:#A9ABCD;
  --edge:#0A0B1D; --hair:#3B4076; --link:#A4C8FF; --mark:#846C1F; --danger:#FF8A80;
}
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.4px,transparent 1.6px);background-size:22px 22px;color:var(--ink);font-family:var(--f-body);font-weight:500;font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--link);outline-offset:2px;border-radius:8px}
.wrap{max-width:var(--maxw);margin:0 auto;padding-inline:var(--gut)}
.num{font-variant-numeric:tabular-nums}
.pop{font-family:var(--f-pop);font-weight:400}
.av{display:inline-block;flex:none;width:64px;height:64px;border-radius:50%;border:2.5px solid var(--edge);overflow:hidden;background:var(--sky)}
.av svg{display:block;width:100%;height:100%}

/* ---------- masthead ---------- */
.mast{padding-block:24px 12px}
.mast-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 18px}
.brand{font-family:var(--f-pop);font-weight:400;font-size:clamp(28px,6vw,44px);line-height:1.15;margin:0;letter-spacing:.01em}
.brand .b2{display:inline-block;background:var(--coral);color:var(--on-pop);border:3px solid var(--edge);border-radius:14px;padding:0 .28em .04em;margin-left:.2em;transform:rotate(-4deg);box-shadow:var(--sh)}
.tagline{margin:8px 0 0;color:var(--ink-2);font-size:14px;font-weight:700;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.unofficial{font-size:11px;font-weight:900;border:2px solid var(--edge);border-radius:99px;padding:0 8px;background:var(--surface);color:var(--ink);line-height:1.6}
.sync{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--ink-2);background:var(--surface);border:2px solid var(--edge);border-radius:99px;padding:3px 12px 3px 9px;white-space:nowrap}
.sync i{width:10px;height:10px;border-radius:50%;border:2px solid var(--edge);background:var(--muted);display:inline-block}
.sync[data-s="synced"] i{background:var(--mint)}
.sync[data-s="saving"] i{background:var(--sun)}
.sync[data-s="error"] i{background:var(--coral)}
.parade-row{display:flex;align-items:center;gap:14px;margin-top:16px;min-width:0}
.parade{display:flex;flex:0 1 auto;min-width:0;overflow:hidden;padding:8px 6px 6px 2px}
.parade a{display:block;margin-left:-9px;transition:transform .2s}
.parade a:first-child{margin-left:0}
.parade .av{width:54px;height:54px}
.parade a:hover{transform:translateY(-6px) rotate(-6deg);position:relative;z-index:2}
.say{flex:none;position:relative;background:var(--surface);border:2.5px solid var(--edge);border-radius:16px;padding:6px 12px;font-size:13px;font-weight:900;box-shadow:var(--sh)}
.say::before{content:"";position:absolute;left:-10px;top:50%;margin-top:-7px;border:7px solid transparent;border-right:10px solid var(--edge);border-left:0}
.say::after{content:"";position:absolute;left:-6px;top:50%;margin-top:-5px;border:5px solid transparent;border-right:7px solid var(--surface);border-left:0}
.latest{display:flex;gap:10px;align-items:center;margin-top:14px;font-size:13.5px;min-width:0;text-decoration:none}
.latest .new{flex:none;font-family:var(--f-pop);font-size:11px;background:var(--sun);color:var(--on-pop);border:2px solid var(--edge);border-radius:8px;padding:1px 7px;transform:rotate(-3deg)}
.latest .d{flex:none;color:var(--muted)}
.latest .t{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;border-bottom:2px solid var(--hair)}
.latest:hover .t{border-color:var(--coral)}
@media (max-width:560px){.say{display:none}.mast{padding-block:16px 6px}.brand{font-size:27px;white-space:nowrap}.mast-top{gap:8px 12px}.brand .b2{border-width:2.5px}.sync{font-size:11px;padding:2px 9px 2px 7px}.sync span{max-width:9em;overflow:hidden;text-overflow:ellipsis}.tagline{font-size:12.5px;margin-top:6px}.parade-row{margin-top:8px}.parade .av{width:44px;height:44px}.latest{margin-top:8px;font-size:12.5px}}

/* ---------- sticky bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:2.5px solid var(--edge)}
.bar .wrap{padding-block:10px}
.bar-in{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.search{position:relative;flex:1 1 320px;min-width:0}
.search input{width:100%;font:inherit;font-weight:700;font-size:16px;padding:10px 42px 10px 42px;border:2.5px solid var(--edge);border-radius:99px;background:var(--surface);color:var(--ink);box-shadow:var(--sh);-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--muted);font-weight:500}
.search input:focus{outline:none;box-shadow:3px 3px 0 var(--coral)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2.6}
.search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:var(--surface-2);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:16px;line-height:1;font-weight:900}
.search input::-webkit-search-cancel-button{display:none}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 4px 4px 1px;flex:0 1 auto;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;text-decoration:none;padding:6px 13px;font-size:14px;font-weight:900;border:2.5px solid var(--edge);border-radius:99px;background:var(--surface);white-space:nowrap}
.tab small{font-size:11.5px;margin-left:5px;opacity:.7}
.tab[aria-current="page"]{background:var(--ink);color:var(--bg)}
.tab:hover{background:var(--surface-2)}
.tab[aria-current="page"]:hover{background:var(--ink)}
@media (max-width:480px){.tab{padding:5px 10px;font-size:13px}.tab small{display:none}}

main{padding-block:22px 72px}

/* ---------- common ---------- */
.h-pop{font-family:var(--f-pop);font-weight:400;font-size:21px;line-height:1.35;margin:0}
.lead{margin:4px 0 0;color:var(--ink-2);font-size:13.5px}
.chip{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--edge);background:var(--surface);border-radius:99px;padding:2px 11px;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink);text-decoration:none;line-height:1.6}
.chip:hover{background:var(--surface-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tagc{background:var(--lilac);color:var(--on-pop)}
.tagc:hover{background:var(--sun)}
.badge{display:inline-block;font-family:var(--f-body);font-weight:900;font-size:11px;line-height:1;padding:4px 8px;border-radius:99px;border:2px solid var(--edge);background:var(--lilac);color:var(--on-pop);vertical-align:3px;margin-left:6px;white-space:nowrap}
.badge.live{background:var(--coral)}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;border-radius:99px;padding:9px 18px;font-size:14px;font-weight:900;cursor:pointer;border:2.5px solid var(--edge);line-height:1.3;box-shadow:var(--sh);background:var(--surface);color:var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--edge)}
.btn.primary{background:var(--coral);color:var(--on-pop)}
.btn.ghost{box-shadow:none;font-weight:700;font-size:13px;padding:6px 14px}
.btn.ghost.armed{border-color:var(--danger);color:var(--danger)}
.btn svg{width:13px;height:13px;fill:currentColor;flex:none}
.linkbtn{border:0;background:none;color:var(--link);cursor:pointer;font-size:13px;font-weight:700;padding:4px 2px;text-decoration:underline;text-underline-offset:3px}
.empty{padding:34px 12px;text-align:center;color:var(--ink-2);font-weight:700}
.empty p{margin:0 0 8px}
.meter{height:12px;border-radius:99px;background:var(--surface-2);border:2px solid var(--edge);overflow:hidden}
.meter i{display:block;height:100%;background:var(--mint);border-right:2px solid var(--edge)}
.meter i[style*="width:0"]{border:0}

/* ---------- list controls ---------- */
.ctrl{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center}
.seg{display:inline-flex;background:var(--surface);border:2.5px solid var(--edge);border-radius:99px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:4px 13px;border-radius:99px;font-size:13px;font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sun);color:var(--on-pop);font-weight:900}
.fbtn{border:2.5px solid var(--edge);background:var(--surface);border-radius:99px;padding:5px 14px;font-size:13px;font-weight:900;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.fbtn[aria-expanded="true"]{background:var(--surface-2)}
.fbtn .n{background:var(--coral);color:var(--on-pop);border:2px solid var(--edge);border-radius:99px;font-size:11px;min-width:20px;height:20px;display:inline-grid;place-items:center;padding:0 5px}
.rescount{margin-left:auto;font-size:13px;font-weight:700;color:var(--ink-2)}
.fpanel{background:var(--surface);border:2.5px solid var(--edge);border-radius:18px;padding:14px 16px;margin:12px 0 0;display:grid;gap:12px;box-shadow:var(--sh)}
.fgroup{display:grid;grid-template-columns:4.6em 1fr;gap:8px;align-items:start}
.flab{font-size:12px;font-weight:900;color:var(--muted);padding-top:4px;letter-spacing:.05em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.fpanel .foot{display:flex;justify-content:flex-end}
@media (max-width:520px){.fgroup{grid-template-columns:1fr;gap:4px}.flab{padding-top:0}}
.tagrow{display:flex;gap:10px;align-items:baseline;margin:16px 0 4px}
.tagrow .flab{flex:none;padding:0}
.tagrow .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px}
.tagrow .chips::-webkit-scrollbar{display:none}
.tagrow .chip{flex:none;font-size:12px;padding:1px 9px}
@media (min-width:900px){.tagrow .chips{flex-wrap:wrap;overflow:visible}}

/* ---------- series cards ---------- */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:16px;align-items:start}
.grp{grid-column:1/-1;justify-self:start;font-family:var(--f-pop);font-size:14px;background:var(--sun);color:var(--on-pop);border:2.5px solid var(--edge);border-radius:99px;padding:2px 14px;margin:18px 0 -2px;box-shadow:2px 2px 0 var(--edge)}
.grp:first-child{margin-top:6px}
.scard{position:relative;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:14px 16px 15px 14px;background:var(--surface);border:2.5px solid var(--edge);border-radius:20px;box-shadow:var(--sh);text-decoration:none;align-content:start}
.scard .av{grid-row:1/span 4}
.scard:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--edge)}
.sc-num{font-family:var(--f-pop);font-size:12.5px;color:var(--muted);line-height:1.2}
.sc-name{font-family:var(--f-pop);font-weight:400;font-size:17px;line-height:1.4;margin:0;text-wrap:balance}
.sc-desc{font-size:13px;color:var(--ink-2);margin:2px 0 0;line-height:1.6}
.sc-meta{font-size:12px;color:var(--muted);margin-top:5px;font-weight:700}
.sc-prog{grid-column:2;display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;font-weight:900}
.sc-prog .meter{flex:1;height:10px;max-width:160px}
.stamp{position:absolute;top:-10px;right:12px;font-family:var(--f-pop);font-size:12px;background:var(--mint);color:var(--on-pop);border:2.5px solid var(--edge);border-radius:10px;padding:1px 9px;transform:rotate(5deg);box-shadow:2px 2px 0 var(--edge)}

/* ---------- series detail ---------- */
.back{display:inline-flex;gap:6px;align-items:center;text-decoration:none;font-weight:900;font-size:14px;margin-bottom:14px;border-bottom:2px solid var(--hair)}
.back:hover{border-color:var(--coral)}
.dhero{display:grid;grid-template-columns:auto 1fr;gap:16px 24px;background:var(--surface);border:3px solid var(--edge);border-radius:26px;box-shadow:5px 5px 0 var(--edge);padding:22px 24px}
.dhero > .av{width:132px;height:132px;border-width:3px;grid-row:1/span 3}
.dhero > .bubble{grid-column:2;justify-self:start;margin:0}
.dh-rest{grid-column:2}
.d-num{font-family:var(--f-pop);font-size:13px;color:var(--muted)}
.d-name{font-family:var(--f-pop);font-weight:400;font-size:clamp(24px,4.4vw,34px);line-height:1.3;margin:2px 0 0;text-wrap:balance}
.bubble{position:relative;display:inline-block;background:var(--surface-2);border:2.5px solid var(--edge);border-radius:16px;padding:9px 15px;font-weight:900;font-size:15px;line-height:1.6;max-width:36em}
.bubble::before{content:"";position:absolute;left:-12px;top:14px;border:8px solid transparent;border-right:12px solid var(--edge);border-left:0}
.bubble::after{content:"";position:absolute;left:-7.5px;top:16px;border:6px solid transparent;border-right:9px solid var(--surface-2);border-left:0}
.d-stats{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:13px;color:var(--ink-2);font-weight:700}
.d-stats b{color:var(--ink);font-weight:900}
.d-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.d-tags .plain{background:var(--surface);font-weight:500;color:var(--ink-2)}
.d-links{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:2.5px dashed var(--hair);padding-top:14px}
.d-links .flab{padding:0;margin-right:2px}
.mini{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:13px;font-weight:900;border:2px solid var(--edge);border-radius:99px;padding:2px 12px 2px 3px;background:var(--surface)}
.mini .av{width:28px;height:28px;border-width:2px}
.mini:hover{background:var(--surface-2)}
@media (max-width:600px){
  .dhero{grid-template-columns:84px 1fr;padding:18px 16px;gap:12px 14px}
  .dhero > .av{width:84px;height:84px;grid-row:auto}
  .dhero > .bubble{grid-column:1/-1;margin-top:4px}
  .bubble::before{left:26px;top:-12px;border:8px solid transparent;border-bottom:12px solid var(--edge);border-top:0}
  .bubble::after{left:28px;top:-7.5px;border:6px solid transparent;border-bottom:9px solid var(--surface-2);border-top:0}
  .dh-rest{grid-column:1/-1}
}
.dprog{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin:22px 0 0}

.dprog .m .lbl{font-size:13px;font-weight:900;display:flex;justify-content:space-between;margin-bottom:4px}
.dprog .hint{flex-basis:100%;margin:-4px 0 0;font-size:12px;color:var(--muted);font-weight:700}
.bulk{display:flex;gap:8px;flex-wrap:wrap}
.sec{margin-top:30px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin-bottom:12px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:14px}
.rcard{position:relative;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;text-decoration:none;background:var(--surface);border:2.5px solid var(--edge);border-radius:18px;padding:12px 14px 12px 12px;box-shadow:var(--sh)}

.rc-name{font-family:var(--f-pop);font-size:14.5px;line-height:1.35}
.rc-name small{font-family:var(--f-body);font-weight:900;font-size:11.5px;color:var(--muted);margin-right:4px}
.rc-why{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.55}
.rc-from{grid-column:1/-1;font-size:11.5px;color:var(--muted);font-weight:700;margin-top:6px;padding-top:6px;border-top:2px dashed var(--hair)}
.snav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:30px}
.snav a{display:flex;align-items:center;gap:10px;text-decoration:none;border:2.5px solid var(--edge);border-radius:16px;padding:10px 12px;background:var(--surface);box-shadow:var(--sh);min-width:0}
.snav a:hover{background:var(--surface-2)}
.snav .av{width:40px;height:40px;border-width:2px}
.snav small{display:block;color:var(--muted);font-size:11.5px;font-weight:700}
.snav span{font-family:var(--f-pop);font-size:13.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.snav .nx > div{min-width:0}

/* ---------- episodes ---------- */
.elist{background:var(--surface);border:2.5px solid var(--edge);border-radius:22px;box-shadow:var(--sh);padding:2px 20px}
.ep{display:grid;grid-template-columns:1fr auto;gap:5px 22px;padding:16px 0 17px;border-bottom:2.5px dashed var(--hair)}
.ep:last-child{border-bottom:0}
.ep-head{display:flex;flex-wrap:wrap;gap:3px 10px;align-items:center;font-size:12.5px;color:var(--muted);font-weight:700;grid-column:1}

.eser{color:var(--ink-2);text-decoration:none;font-weight:900}

.ep-title{grid-column:1;font-weight:900;font-size:16px;line-height:1.55;margin:0;text-wrap:pretty}
.ep.is-done .ep-title{color:var(--muted)}
.ep-sum{grid-column:1;margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.75;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;max-width:48em}

.ep-note{grid-column:1;margin:0;font-size:12px;color:var(--muted)}
.more{grid-column:1;justify-self:start;border:0;background:none;color:var(--link);font-size:12.5px;font-weight:900;cursor:pointer;padding:0}

.play{display:inline-flex;justify-content:center;align-items:center;gap:7px;text-decoration:none;background:var(--coral);color:var(--on-pop);border:2.5px solid var(--edge);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:900;white-space:nowrap;box-shadow:2px 2px 0 var(--edge)}

.tgs{display:flex;gap:6px}
.tg{flex:1;border:2px solid var(--edge);background:var(--surface);border-radius:99px;padding:5px 8px;font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;gap:4px;justify-content:center;align-items:center;white-space:nowrap}

mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}

.shead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin:0 0 14px}

.taghead p{margin:0;font-weight:900}
.taghead .faces{display:flex;margin-left:auto}
.taghead .faces .av{width:44px;height:44px;margin-left:-10px;border-width:2px}

.foot-note{margin-top:44px;font-size:12px;color:var(--muted);font-weight:700;max-width:54em}

.resume{font-size:11.5px;font-weight:900;background:var(--surface-2);border:2px solid var(--edge);border-radius:99px;padding:0 8px;color:var(--ink);line-height:1.6}

.pl-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pl-btn .s{position:absolute;font-size:8.5px;font-weight:900}
.pl-skip{position:relative}
.pl-main{width:50px;height:50px;background:var(--coral);color:var(--on-pop);box-shadow:2px 2px 0 var(--edge)}
.pl-main svg{fill:currentColor;stroke:none;width:20px;height:20px}

body.has-player main{padding-bottom:190px}
@media (min-width:900px){

ルテノン神殿といった壮大な建築群が建てられたのもこの頃で、総合力にかけては間違いなくギリシャ世界ナンバーワンでした。 しかし、他国を圧する国力を身につけたはずの強国アテネは、なんと脳筋国家スパルタに負けてしまいます。 その敗因はアテネがはまった「成熟国家の罠」 国家の興亡を、組織運営と絡めてお話しました。途中から話が大脱線します。","a":"2174363/https%3A%2F%2Fd3ctxlq1ktw2nl.cloudfront.net%2Fproduction%2F2019-0-23%2F8732409-48000-2-44bdfbeffc363.mp3","k":"s","n":2,"o":6,"t":"アテネはどうすればスパルタに勝てたのか？頭脳が脳筋に負ける時"},{"i":"e30rvg","d":"2019-01-23","l":768,"s":"6tO5pCxTSv8XmAX7F3BzRo","m":"①スパルタ男は毎週肉体をみんなからチェックされる ②少しでも贅肉がついていたら鞭打ちの刑 ③スパルタはデブに厳しい国！楽に暮らしたければアテネにGO！","a":"2174384/https%3A%2F%2Fd3ctxlq1ktw2nl.cloudfront.net%2Fstaging%2F2020-09-11%2Fc45972aeebeafbbf3e7ace0b814b2e8f.m4a","k":"s","n":2,"o":7,"t":"草食系男子がスパルタ漢にお悩み相談するとしたら？"},{"i":"e355gg","d":"2019-02-08","l":816,"s":"5Fq3DFgW7KEKJuZ0UTUIUN","m":"①匿名性のある発言が史上初めて社会に影響を与えはじめた ―ネット登場以前はすべての発言に「誰が言ったか？」「発言者の地位・社会的立場・経歴」が紐付かれていた。 ―匿名性のある発言が社会に影響を与えるほど機能することは基本的になかったが、匿名性の発言が市民権を得たのがネット登場後の時代の特徴。 ②膨大な数の発信者が出現した ―ネット登場以前では、情報が影響力を発揮するプロセスは、ある一人の偉大な発信者が多数の受信者に対して発信するというトップダウン型のコミュニケーションが殆どだった。 ―しかしインターネットの登場により個人の発信者の数が一気に増え、民衆だけで大規模な世論形成が可能になるなど、社会の在り方が大きく変化していきます。","a":"2315216/https%3A%2F%2Fd3ctxlq1ktw2nl.cloudfront.net%2Fproduction%2F2019-1-7%2F9691588-44100-2-414569b7fb02a.mp3","k":"s","n":3,"o":1,"t":"インターネットの本当の凄さ"},{"i":"e373hb","d":"2019-02-14","l":851,"s":"6POSde1JgN7ZzlXNSowcRb","m":"①文字は人類の思考回路を徹底的に変えた ②文字によって情報の「記録」と「分析」ができるようになった ③文字によって世界を「数字」で量的に把握・記述できるようになった","a":"2378731/https%3A%2F%2Fd3ctxlq1ktw2nl.cloudfront.net%2Fproduction%2F2019-1-14%2F9992718-44100-2-8db2a20928ccf.mp3","k":"s","n":3,"o":2,"t":"文字、爆誕。"},{"i":"e392cs","d":"2019-02-21","l":775,"s":"0lmLznEl2QEVcV2UnVA31V","m":"①技術が広がるきっかけとなるのは「ニーズ」と「コスト」 ②一対多のマスメディアの走りとなった活版印刷 ③マスメディアによって「国家」という目に見えない概念が想像・共有され、新しい帰属の仕方を生み出した","a":"2443100/https%3A%2F%2Fd3ctxlq1ktw2nl.cloudfront.net%2Fproduction%2F2019-1-21%2F10283037-44100-2-83b02e9df405f.mp3","k":"s","n":3,"o":3,"t":"炎上の元祖！活版印刷"},{"i":"e3bbj7","d":"2019-03-01","l":995,"s":"4quyVSN2mBwCLrAqMsTEDB","m":"①電気通信によって広告業が発達、圧倒的な市場開拓により大量消費社会の一因となった ②情報の伝達スピードが人間の移動速度を超える ③情 して散らばっていたユダヤ人がキリスト教徒ら相手に金貸し業を始め、ユダヤ人商人としてのポジションを形成していく。 ②欧州で拡大する国家間貿易により両替需要が増し、キリスト教徒は両替手数料の中に利子分を含ませる手法を用いて宗教的制約の回避を図った。これによりマジョリティーであるキリスト教世界で金融業が振興し、銀行誕生へと繋がっていく ③ストックホルム銀行を皮切りに銀行機能の一つである「貨幣創造」がなされ、資本主義の起点となっていく ※補足 世界最古の中央銀行は1668年に誕生した「スウェーデン国立銀行」です。","a":"9189574/https%3A%2F%2Fd3ctxlq1ktw2nl.cloudfront.net%2Fproduction%2F2019-11-22%2F40141607-44100-2-05f1b547dae3c.mp3","k":"s","n":12,"o":4,"t":"銀行の本当の役割とは！？―銀行が創る「目に見えないおカネ」の正体"},{"i":"e9tbj5","d":"2020-01-06","l":1072,"s":"4GQ3cQzzLzxpWOouW4cCQP","m":"①中央銀行が誕生するまでは各銀行、団体それぞれが貨幣を発行していた ②貨幣の供給過多によるインフレなどを経た結果、貨幣の流通量や物価のコントロールを政策に載せる必要性を受けて、中央銀行が誕生した ③日露戦争で日本がロシアに勝利できた背景には、国債による海外から軍事費調達の成功があった ※補足 世界最古の中央銀行は1668年に誕生した「スウェーデン国立銀行」です。","a":"9399333/https%3A%2F%2Fd3ctxlq1ktw2nl.cloudfront.net%2Fproduction%2F2019-11-30%2F41261057-44100-2-a85f21d058077.mp3","k":"s","n":12,"o":5,"t":"中央銀行の役割─お金を司る銀行 of 銀行！"},{"i":"e9tbjp","d":"2020-01-09","l":1839,"s":"5pbp9VEth1KBmpnSO8ldSe","m":"①株式会社の本質は「リスク分散」「リソース集約」「生産性向上」 ②今日の社会を支える殆どの物が会社から作られているのは、それだけ会社が経済活動において効率的・効果的な組織形態だから ③オランダ東インド会社などの初期の株式会社は、貿易先国での反乱鎮圧や他国との戦争を目的とする軍隊まで保有していた ※補足 産業革命時に今日まで連なる「8時間労働制」を提唱したのはイギリス人実業家のロバート・オウエン","a":"9399353/https%3A%2F%2Fd3ctxlq1ktw2nl.cloudfront.net%2Fproduction%2F2019-11-30%2F41261240-44100-2-becd13c421078.mp3","k":"s","n":12,"o":6,"t":"株式会社の誕生―世界経済を変えたヤバすぎる発明"},{"i":"e9tbn8","d":"2020-01-13","l":2309,"s":"1egVMAudpUuhC5xS8cPvTk","m":"①資本主義の３要素「私有財産」「競争環境」「市場経済」 ②生産性や利益への投資は財産の私有が保障されてないと動機が生まれにくい ③資本主義は王権が比較的に弱かったイギリスで勃興した","a":"9399464/https%3A%2F%2Fd3ctxlq1ktw2nl.cloudfront.net%2Fproduction%2Fexports%2F8c2088c%2F9399464%2F1a7aa62a16f2a8bd4bd67a2f8af23ae3.m4a","k":"s","n":12,"o":7,"t":"世界を進化させた資本主義 ― 一方その頃、中国は…？"},{"i":"e9tbnm","d":"2020-01-16","l":1000,"s":"1SZ9l5mD7SRHLNTD7if9Pb","m":"歴史ギークたちが語る、世界の歴史キュレーションラジオ・コテンラジオ番外編です！ 「タイムマシンがあったら、どこに行く？」という樋口の問いから始まる、抱腹絶倒間違いなしの珍回答100連発！ コテンラジオからお送りする新春初笑い！ どうぞご視聴ください。","a":"9399478/https%3A%2F%2Fd3ctxlq1ktw2nl.cloudfront.net%2Fproduction%2F2019-11-30%2F41262400-44100-2-d32f16762e1bb.mp3","     const t = audio.currentTime, d = audio.duration;
    if (t > 5 && (!isFinite(d) || t < d - 20)) POS[cur.i] = Math.floor(t);
    sv(LS_POS, POS);
  }
  function showErr(){
    const p = el('plErr'); if (!cur) return;
    p.innerHTML = `この回はここで再生できませんでした。<a href="${spotify(cur)}" target="_blank" rel="noopener">Spotifyで開く</a>`;
    p.hidden = false; paint();
  }
  function start(){
    const at = audio.getAttribute('src');
    const p = audio.play();
    if (p && p.catch) p.catch(err => {
      if (audio.getAttribute('src') !== at) return;  // 古い再生要求の失敗は無視
      if (err && err.name === 'AbortError') return;
      if (err && err.name === 'NotAllowedError') { paint(); return; }
      fail();
    });
  }
  function fail(){
    if (!cur) return;
    const s = audio.getAttribute('src');
    if (!s || s === lastFailed) return;
    lastFailed = s;
    const list = urls(cur);
    if (attempt < list.length - 1) {
      attempt++;
      if (!pendingSeek) pendingSeek = POS[cur.i] || 0;
      audio.src = list[attempt]; audio.defaultPlaybackRate = speed; audio.playbackRate = speed;

  }
  function open(e, fromStart){
    if (cur && cur !== e) savePos(true);
    cur = e; el('plErr').hidden = true; attempt = 0; lastFailed = null;
    pendingSeek = fromStart ? 0 : (POS[e.i] || 0);
    audio.src = urls(e)[0]; audio.defaultPlaybackRate = speed; audio.playbackRate = speed;

  }
  function toggle(e){ if (cur === e) { if (audio.paused) start(); else audio.pause(); } else open(e); }
  function close(){ audio.pause(); savePos(true); cur = null; audio.removeAttribute('src'); audio.load(); el('player').hidden = true; document.body.classList.remove('has-player'); paint(); }
  function paintMeta(){
    if (!cur) return;
    const s = cur.ser;
    el('plT').textContent = (cur.num ? '【' + cur.num + '】' : '') + cur.t;
    el('plS').innerHTML = s ? `<a href="#s${s.n}">${esc(s.name)}</a>` : (cur.k === 'b' ? '番外編' : esc(cur.g || '特別編'));
    const a = el('plAv'); a.href = s ? '#s' + s.n : (cur.k === 'b' ? '#bangai' : '#special');
    a.innerHTML = s ? av(s) : `<span class="av" style="background:var(--sun)">${AV.svg(3, '世界')}</span>`;
  }
  function paint(){
    const playing = !!cur && !audio.paused;
    const pb = el('plPlay'); pb.innerHTML = playing ? ICON_PAUSE : ICON_PLAY; pb.setAttribute('aria-label', playing ? '一時停止' : '再生');
    el('plSpd').textContent = speed + 'x';
    el('plAuto').setAttribute('aria-pressed', auto);
    const d = audio.duration, t = audio.currentTime;
    el('plDur').textContent = isFinite(d) ? fmt(d) : (cur ? fmt(cur.l) : '--:--');
    if (!seeking) { el('plCur').textContent = fmt(t); el('plRange').value = isFinite(d) && d > 0 ? Math.round(t / d * 1000) : 0; }
    document.querySelectorAll('[data-play]').forEach(b => {
      if (b.classList.contains('btn')) return;
      const on = cur && b.dataset.play === cur.i;
      b.classList.toggle('is-on', !!on);
      b.innerHTML = on && playing ? ICON_PAUSE.replace('viewBox="0 0 20 20"', 'viewBox="0 0 20 20" width="11" height="11"') + '一時停止' : SVG_PLAY + (on ? '再開' : 'ここで再生');
    });
  }
  function media(){
    if (!('mediaSession' in navigator) || !cur) return;
    try { navigator.mediaSession.metadata = new MediaMetadata({title: (cur.num ? '【' + cur.num + '】' : '') + cur.t, artist: 'コテンラジオ', album: cur.ser ? cur.ser.name : '番外編・特別編'}); } catch (e) {}
  }
  if ('mediaSession' in navigator) {
    const h = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch (e) {} };
    h('play', () => start()); h('pause', () => audio.pause());
    h('seekbackward', () => { audio.currentTime = Math.max(0, audio.currentTime - 15); });
    h('seekforward', () => { audio.currentTime = Math.min(audio.duration || 1e9, audio.currentTime + 30); });
    h('seekto', d => { if (d && isFinite(d.seekTime)) audio.currentTime = d.seekTime; });

  audio.addEventListener('pause', () => { savePos(true); paint(); });
  audio.addEventListener('timeupdate', () => { if (!seeking) { const d = audio.duration, t = audio.currentTime; el('plCur').textContent = fmt(t); if (isFinite(d) && d > 0) el('plRange').value = Math.round(t / d * 1000); } savePos(false); });
  audio.addEventListener('durationchange', paint);
  audio.addEventListener('error', () => { if (cur && audio.getAttribute('src')) fail(); });
  audio.addEventListener('ended', () => {
    const done = cur; if (!done) return;
    delete POS[done.i]; sv(LS_POS, POS);
    setStatus(done.i, 1);
    const n = auto ? nextOf(done) : null;
    if (n && n.a) open(n, true); else paint();
  });
  el('plPlay').addEventListener('click', () => { if (cur) toggle(cur); });
  el('plBack').addEventListener('click', () => { audio.currentTime = Math.max(0, audio.currentTime - 15); });
  el('plFwd').addEventListener('click', () => { audio.currentTime = Math.min(audio.duration || 1e9, audio.currentTime + 30); });
  el('plSpd').addEventListener('click', () => { speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length]; audio.defaultPlaybackRate = speed; audio.playbackRate = speed; sv(LS_SPD, speed); paint(); });
  el('plAuto').addEventListener('click', () => { auto = !auto; sv(LS_AUTO, auto); paint(); });
  el('plClose').addEventListener('click', close);
  const rg = el('plRange');
  rg.addEventListener('input', () => { seeking = true; const d = audio.duration; if (isFinite(d)) el('plCur').textContent = fmt(rg.value / 1000 * d); });
  rg.addEventListener('change', () => { const d = audio.duration; if (isFinite(d)) audio.currentTime = rg.value / 1000 * d; seeking = false; });
  document.addEventListener('keydown', ev => {

})() : null;

  const doneLen = done.reduce((a,e) => a + e.l, 0);
  const later = EPS.filter(e => ST[e.i] === 2).sort((a,b) => a.d.localeCompare(b.d));
  const prog = SERIES.filter(s => sState(s) === 'prog').sort((a,b) => b.n - a.n);
  const fin = SERIES.filter(s => sState(s) === 'done');
  const sug = suggestions();
  let h = `<div class="shead"><h2 class="h-pop">マイリスト</h2><p>「聞いた」「あとで」を押したエピソードがここにまとまります。</p></div>
  <div class="mstats">
    <div><small>聞いた</small><b class="num">${done.length}<span>/ ${EPS.length}話</span></b></div>
    <div><small>聞いた時間</small><b class="num">${fhours(doneLen)}<span>時間</span></b></div>
    <div><small>聴了シリーズ</small><b class="num">${fin.length}<span>/ ${SERIES.length}</span></b></div>
    <div><small>あとで聞く</small><b class="num">${later.length}<span>話</span></b></div>
  </div>`;
  const partial = Player ? EPS.filter(e => ST[e.i] !== 1 && Player.pos(e.i)) : [];
  if (partial.length) h += `<section class="sec"><div class="sec-head"><h3 class="h-pop">聞きかけ</h3><p class="lead">途中で止めたエピソード。止めたところから再生します</p></div><div class="elist">${partial.map(e => epRow(e, {showSeries:true})).join('')}</div></section>`;
  h += `<section class="sec"><div class="sec-head"><h3 class="h-pop">続きから</h3><p class="lead">途中まで聞いたシリーズの次の話</p></div>`;
  h += prog.length ? `<div class="elist">${prog.map(s => epRow(nextEp(s), {showSeries:true})).join('')}</div>`
                   : `<div class="empty"><p>途中のシリーズはまだありません。</p></div>`;
  h += `</section><section class="sec"><div class="sec-head"><h3 class="h-pop">あなたへのおすすめ</h3><p class="lead">聞いたシリーズとつながる、まだ聞いていないシリーズ</p></div>`;
  h += sug.length ? `<div class="rgrid">${sug.map(x => rCard(x.s, x.why, x.from.slice(0, 2).map(f => esc(f.name)).join('・') + ' を聞いたので')).join('')}</div>`
                  : `<div class="empty"><p>エピソードに「聞いた」を付けると、つながるシリーズをおすすめします。</p></div>`;
  h += `</section><section class="sec"><div class="sec-head"><h3 class="h-pop">あとで聞く</h3><p class="lead">配信順</p></div>`;
  h += later.length ? `<div class="elist">${later.map(e => epRow(e, {showSeries:true})).join('')}</div>`
                    : `<div class="empty"><p>エピソードの「あとで」を押すと、ここに並びます。</p></div>`;
  h += `</section>`;
  if (fin.length) h += `<section class="sec"><div class="sec-head"><h3 class="h-pop">聴了したシリーズ</h3></div><div class="sgrid">${fin.sort((a,b)=>a.n-b.n).map(s => sCard(s)).join('')}</div></section>`;
  return h;
}
function renderSearch(){
  const terms = query.trim().split(/\s+/).map(normQ).filter(Boolean);
  if (!terms.length) return '';
  const sHits = SERIES.filter(s => { const hay = normQ(s.name + ' ' + s.desc + ' ' + s.reg.join(' ') + ' ' + s.th.join(' ') + ' ' + s.era + ' ' + s.tags.map(k => TBY.get(k).l).join(' ')); return terms.every(t => hay.includes(t)); });
  const tHits = TAGS.filter(t => terms.every(q => normQ(t.l + t.d).includes(q)));
  const hits = [];
  for (const e of EPS) {
    const n = norms(e);
    let ok = true, score = 0;
    for (const t of terms) {
      const inT = n.t.s.includes(t), inM = n.m.s.includes(t), inX = n.x.includes(t);
      if (!inT && !inM && !inX) { ok = false; break; }
      score += inT ? 3 : inX ? 2 : 1;
    }
    if (ok) hits.push({e, score});
  }
  const groups = new Map();
  for (const hit of hits) {
    const e = hit.e, key = e.k === 's' ? 's' + e.n : e.k === 'b' ? 'b' : 'p';
    if (!groups.has(key)) groups.set(key, {key, eps: [], best: 0, n: e.k === 's' ? e.n : (e.k === 'b' ? 1000 : 1001)});
    const g = groups.get(key); g.eps.push(e); g.best = Math.max(g.best, hit.score);
  }
  const gl = [...groups.values()].sort((a,b) => b.best - a.best || b.eps.length - a.eps.length || a.n - b.n);
  let h = `<div class="shead"><h2 class="h-pop">「${esc(query.trim())}」</h2><p>${sHits.length ? `シリーズ <span class="num">${sHits.length}</span>件・` : ''}エピソード <span class="num">${hits.length}</span>件</p></div>`;
  if (tHits.length) h += `<div class="chips" style="margin-bottom:6px">${tHits.map(t => tagChip(t.k)).join('')}</div>`;
  if (sHits.length) h += `<section class="sgroup"><h3>シリーズ</h3><div class="sgrid">${sHits.map(s => sCard(s, terms)).join('')}</div></section>`;
  let shown = 0;
  for (const g of gl) {
    if (shown > 400) break;
    let title;
    if (g.key[0] === 's') { const s = SBY.get(g.n); title = `${av(s)}<a href="#s${s.n}">#${s.n} ${esc(s.name)}</a>`; g.eps.sort((a,b) => a.o - b.o); }
    else if (g.key === 'b') { title = '番外編'; g.eps.sort((a,b) => b.o - a.o); }
    else { title = '特別編・お知らせ'; g.eps.sort((a,b) => b.d.localeCompare(a.d)); }
    h += `<section class="sgroup"><h3>${title} <small>${g.eps.length}件</small></h3><div class="elist">${g.eps.map(e => epRow(e, {terms})).join('')}</div></section>`;
    shown += g.eps.length;
  }
  if (!hits.length && !sHits.length) h += `<div class="empty"><p>見つかりませんでした。</p><p>表記ゆれ（カタカナ・ひらがな・「・」「＝」「ー」の有無）は吸収しています。別の言い方や人名の一部で試してみてください。</p></div>`;
  return h;
}
function footNote(){
  return `<div class="foot-note"><p>コテンラジオをもっと楽しむために、いちリスナーが作った非公式の索引です。番組・株式会社COTENとは関係ありません。</p><p>エピソード名と「今回のお話」は公式RSS（${fdate(DATA.built)}取得）から引用しています。シリーズ紹介文・時代・地域・テーマ・つながり・キャラクターは独自に付けたもので、公式のものではありません。</p>${GH ? '<p>音声は公式RSSの配信元から直接再生しています。「Spotifyで開く」からSpotifyでも聴けます。聞いた／あとで・再生位置は、このブラウザにだけ保存されます。</p>' : '<p>再生はSpotifyのエピソードページが開きます。倍速はSpotifyアプリの再生画面で変更できます。</p>'}</div>`;
}

/* ---------------- render / route ---------------- */
function render(){
  renderTabs();
  const m = $('#main');
  if (query.trim()) m.innerHTML = renderSearch();
  else if (view.name === 'series') m.innerHTML = renderSeries(view.n);
  else if (view.name === 'tag') m.innerHTML = renderTag(view.k);
  else if (view.name === 'bangai') m.innerHTML = renderBangai() + footNote();
  else if (view.name === 'special') m.innerHTML = renderSpecial() + footNote();
  else if (view.name === 'mylist') m.innerHTML = renderMylist() + footNote();
  else m.innerHTML = renderList();
  if (Player) Player.paint();
  requestAnimationFrame(markClamped);
}
function markClamped(){
  document.querySelectorAll('.ep').forEach(a => {
    const p = a.querySelector('.ep-sum'), b = a.querySelector('.more');
    if (p && b && !a.classList.contains('open')) b.hidden = p.scrollHeight <= p.clientHeight + 2;
  });
}
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  const prev = view.name;
  if (prev === 'list' && !query) listScroll = window.scrollY;
  if (/^s\d+$/.test(h)) view = {name:'series', n: +h.slice(1)};
  else if (/^t-[a-z]+$/.test(h)) view = {name:'tag', k: h.slice(2)};
  else if (h === 'bangai' || h === 'special' || h === 'mylist') view = {name:h};
  else view = {name:'list'};
  if (query) { query = ''; $('#q').value = ''; $('#qclr').hidden = true; }
  render();
  window.scrollTo(0, view.name === 'list' && (prev === 'series' || prev === 'tag') ? listScroll : 0);
}
function refreshStatus(){
  document.querySelectorAll('.ep[data-id]').forEach(a => {
    const v = ST[a.dataset.id];
    a.classList.toggle('is-done', v === 1);
    a.querySelector('[data-act="done"]').setAttribute('aria-pressed', v === 1);
    a.querySelector('[data-act="later"]').setAttribute('aria-pressed', v === 2);
  });
  document.querySelectorAll('[data-prog]').forEach(el => { el.outerHTML = progHTML(SBY.get(+el.dataset.prog)); });
  document.querySelectorAll('[data-stamp]').forEach(el => { el.outerHTML = stampHTML(SBY.get(+el.dataset.stamp)); });
  renderTabs();
  if (Player) Player.paint();
  if (!query && view.name === 'series') {
    const s = SBY.get(view.n), od = $('#dprog');
    if (s && od) { const tmp = document.createElement('div'); tmp.innerHTML = progPanel(s); od.replaceWith(tmp.firstElementChild); if (Player) Player.paint(); }
  }
}

/* ---------------- events ---------------- */
let searchT = null;
$('#q').addEventListener('input', ev => {
  const v = ev.target.value;
  $('#qclr').hidden = !v;
  clearTimeout(searchT);
  searchT = setTimeout(() => {
    const was = !!query.trim();
    if (!was && v.trim() && view.name === 'list') listScroll = window.scrollY;
    query = v; render();
    if (!v.trim() && view.name === 'list') window.scrollTo(0, listScroll); else if (!was) window.scrollTo(0, 0);
  }, 140);
});
$('#qclr').addEventListener('click', () => { const i = $('#q'); i.value = ''; i.dispatchEvent(new Event('input')); i.focus(); });
document.addEventListener('keydown', ev => {
  const a = document.activeElement;
  if (ev.key === '/' && a !== $('#q') && !/INPUT|TEXTAREA/.test(a.tagName)) { ev.preventDefault(); $('#q').focus(); }
  if (ev.key === 'Escape' && a === $('#q') && $('#q').value) $('#qclr').click();
});
let armed = null;
document.addEventListener('click', ev => {
  const t = ev.target.closest('button, a');
  if (!t) return;
  if (t.tagName === 'A') {
    const href = t.getAttribute('href') || '';
    if (href.startsWith('#') && href === location.hash) { ev.preventDefault(); route(); }
    return;
  }
  if (t.dataset.play && Player) { const e = BY_ID.get(t.dataset.play); if (e) Player.toggle(e); return; }
  if (t.dataset.act) {
    const id = t.closest('.ep').dataset.id, cur = ST[id];
    if (t.dataset.act === 'done') setStatus(id, cur === 1 ? 0 : 1);
    else setStatus(id, cur === 2 ? 0 : 2);
    if (view.name === 'mylist' && !query) setTimeout(() => { const y = window.scrollY; render(); window.scrollTo(0, y); }, 500);
    return;
  }
  if (t.classList.contains('more')) { t.closest('.ep').classList.add('open'); t.hidden = true; return; }
  if (t.dataset.sort) { UI.sort = t.dataset.sort; saveUI(); render(); return; }
  if (t.id === 'fbtn') { UI.fopen = !UI.fopen; saveUI(); $('#fpanel').hidden = !UI.fopen; t.setAttribute('aria-expanded', UI.fopen); return; }
  if (t.dataset.f) {
    const g = t.dataset.f, v = t.dataset.v;
    if (g === 'st') UI.st = UI.st === v ? '' : v;
    else UI[g] = UI[g].includes(v) ? UI[g].filter(x => x !== v) : UI[g].concat(v);
    saveUI(); const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  if (t.hasAttribute('data-clear')) { UI.reg = []; UI.era = []; UI.th = []; UI.st = ''; saveUI(); render(); return; }
  if (t.dataset.goto) {
    UI.reg = []; UI.era = []; UI.th = []; UI.st = ''; UI[t.dataset.goto] = [t.dataset.v]; UI.fopen = true; saveUI();
    listScroll = 0; location.hash = 'series'; return;
  }
  if (t.dataset.bulk) {
    if (armed !== t) {
      if (armed && armed.isConnected) { armed.classList.remove('armed'); armed.textContent = armed.dataset.label; }
      t.dataset.label = t.textContent; t.textContent = 'もう一度押すと確定'; t.classList.add('armed'); armed = t;
      setTimeout(() => { if (armed === t) { t.classList.remove('armed'); t.textContent = t.dataset.label; armed = null; } }, 3500);
      return;
    }
    armed = null;
    const s = SBY.get(view.n);
    s.eps.forEach(e => { if (t.dataset.bulk === 'done') ST[e.i] = 1; else delete ST[e.i]; });
    persist(); refreshStatus(); return;
  }
});
window.addEventListener('hashchange', route);
window.addEventListener('resize', () => { clearTimeout(window.__rz); window.__rz = setTimeout(markClamped, 200); });

/* ---------------- boot ---------------- */
const last = EPS[EPS.length - 1];
$('#tagline').innerHTML = `全<span class="num">${EPS.length}</span>話・<span class="num">${SERIES.length}</span>シリーズを、人物とつながりでたどる`;
const PARADE = [20, 24, 27, 17, 33, 62, 49, 13, 53, 18, 64, 23, 60, 50, 10, 29].map(n => SBY.get(n)).filter(Boolean);
$('#parade').innerHTML = PARADE.map(s => `<a href="#s${s.n}" title="${esc(s.name)}">${av(s)}</a>`).join('');
const lt = $('#latest');
lt.href = last.k === 's' ? '#s' + last.n : '#bangai';
lt.innerHTML = `<span class="new">NEW</span><span class="d num">${fdate(last.d)}</span><span class="t">${last.num ? '【' + esc(last.num) + '】' : ''}${esc(last.t)}</span>`;
route();
if (GH) $('#sync').hidden = true; else initSync();
})();
</script>

</body>
